[project]
name = "ddm"
version = "0.1.0"
description = "Data discovery, search and read-only MCP demo for podcasts and journalists"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml==0.7.1",
    "fastapi==0.162.0",
    "fastmcp==4.1.3",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "protego==0.7.0",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "python-multipart==0.0.32",
    "tenacity==9.2.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov",
    "ruff",
    "uvicorn==0.54.0",
]

[project.scripts]
ddm = "ddm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs a local Postgres 18 (DDM_TEST_DATABASE_URL, see docker-compose.yml)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"spikes/**" = ["S608"]

[tool.coverage.report]
fail_under = 80
