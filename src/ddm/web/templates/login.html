{% extends "base.html" %}
{% block title %}Log in · Data Discovery Demo{% endblock %}
{% block content %}
<article>
  <h1>Log in</h1>
  {% if error %}<p role="alert"><mark>{{ error }}</mark></p>{% endif %}
  <form method="post" action="/login">
    <label>Username <input name="username" autocomplete="username" required maxlength="200"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
    <button type="submit">Log in</button>
  </form>
</article>
{% endblock %}
